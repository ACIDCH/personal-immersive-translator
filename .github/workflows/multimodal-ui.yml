name: Multimodal Platform UI & BYOK validation

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'cloudflare/multimodal-api/**'
      - 'src/lib/ai-profiles.js'
      - 'src/lib/providers.js'
      - 'src/lib/settings.js'
      - 'src/options*'
      - 'tests/ai-profiles.test.js'
      - '.github/workflows/multimodal-ui.yml'
      - 'tests/wxt_native_web_e2e.py'
      - 'tests/wxt_web_coverage_matrix_e2e.py'
      - 'tests/wxt_public_site_probe.py'
      - 'tests/portal_real_image_ocr_e2e.py'
      - 'tests/pit_translation_matrix_e2e.py'
      - 'tests/wxt_file_lab_e2e.py'
      - 'tests/wxt_multilingual_ocr_e2e.py'
      - 'services/pdf-layout/**'
      - 'tests/test_pdf2zh_adapter.py'
      - 'tests/test_pdf_provider_profile.py'
      - 'services/pdf_provider_profile.py'
      - 'tests/wxt_video_image_pdf_e2e.py'
      - 'tests/wxt_video_platform_matrix_e2e.py'
      - 'benchmarks/public_video_real_probe.py'
  workflow_dispatch:

concurrency:
  group: multimodal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  custom-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check src/lib/ai-profiles.js
          node --check src/lib/providers.js
          node --check src/options.js
      - name: Universal AI profile and Worker contracts
        run: |
          node --test tests/ai-profiles.test.js
          node --check cloudflare/multimodal-api/src/index.mjs
          node --test cloudflare/multimodal-api/test/*.test.mjs
      - name: Test local PDFMathTranslate subprocess adapter (offline contract only)
        run: python3 -m unittest discover -s tests -p test_pdf2zh_adapter.py -v
      - name: Validate local PDF AI provider model profiles
        run: python3 -m unittest discover -s tests -p test_pdf_provider_profile.py -v

  ui-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [wxt-ui, portal]
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies (preview only)
        run: npm install --no-audit --no-fund
      - name: Prepare WXT types
        if: matrix.app == 'wxt-ui'
        run: npm exec -w wxt-ui wxt prepare
      - name: TypeScript check
        run: npm run check --workspace ${{ matrix.app }}
      - name: Verify DOCX text extraction from a real synthetic OOXML archive
        if: matrix.app == 'portal'
        run: npm run test --workspace portal
      - name: Build UI artifact
        run: npm run build --workspace ${{ matrix.app }}
      - name: Confirm output exists
        run: |
          if [ "${{ matrix.app }}" = "wxt-ui" ]; then
            test -f wxt-ui/.output/chrome-mv3/manifest.json
          else
            test -f portal/dist/index.html
          fi
      - name: Validate native WXT web integration package
        if: matrix.app == 'wxt-ui'
        run: node wxt-ui/scripts/check-native-bundle.mjs
      - name: Upload isolated WXT web-integration package
        if: matrix.app == 'wxt-ui'
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-wxt-web-integration-test
          path: apps/wxt-ui/.output/chrome-mv3
          retention-days: 7

  wxt-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated WXT frontend dependencies
        working-directory: apps
        run: |
          npm install --no-audit --no-fund
          npm run build --workspace wxt-ui
          node wxt-ui/scripts/check-native-bundle.mjs
      - name: Install Chromium testing environment
        run: |
          python -m pip install 'playwright==1.55.0' 'Pillow>=11,<13'
          python -m playwright install --with-deps chromium
      - name: Test real React + PIT web translation in installed MV3
        run: python tests/wxt_native_web_e2e.py
      - name: Verify two isolated profiles and encrypted vault using simulated Supabase transport
        run: python tests/wxt_sync_fixture_e2e.py
      - name: Test editorial coverage, dynamic DOM, HTTP 429 and manual recovery
        run: python tests/wxt_web_coverage_matrix_e2e.py
      - name: Benchmark native PIT on the same 24-paragraph fixture as KISS
        run: python tests/pit_translation_matrix_e2e.py
      - name: Verify actual DOCX and PNG OCR inside the installed WXT extension
        run: python tests/wxt_file_lab_e2e.py
      - name: Check PDF cloud readiness gates before uploading a user file
        run: python tests/wxt_cloud_pdf_preflight_e2e.py
      - name: Test real HTML5 video cues, bilingual image PNG and PDF.js inside WXT
        run: python tests/wxt_video_image_pdf_e2e.py
      - name: Test site-visible captions, embedded Panopto and manual SRT fixtures
        run: python tests/wxt_video_platform_matrix_e2e.py
      - name: Archive machine-readable browser coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-web-coverage-matrix
          path: |
            wxt-web-coverage-report.json
            pit-translation-benchmark.json
            wxt-file-lab-report.json
            wxt-video-image-pdf-e2e-report.json
            wxt-platform-caption-matrix.json
            wxt-sync-fixture-report.json
            pit-v2-options.png
            pit-v2-popup.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Probe public websites in real Chromium (network-dependent, not provider quality)
        # Only on explicit manual verification. Repeated external requests on
        # each development push add noise and may hit rate limits.
        if: github.event_name == 'workflow_dispatch'
        id: real_site_probe
        continue-on-error: true
        run: python tests/wxt_public_site_probe.py
      - name: Probe real public YouTube and Bilibili player UI (non-gating)
        # Known 429/412 restrictions must not be re-probed on every PR commit.
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python benchmarks/public_video_real_probe.py
      - name: Archive real public-video accessibility and caption observations
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-real-public-video-probe
          path: public-video-probe.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive non-gating public-site probe observations
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-public-site-probe
          path: wxt-public-site-probe.json
          if-no-files-found: ignore
          retention-days: 7

  real-image-ocr:
    # Keep informational until the external language-model download is stable
    # across GitHub runner networks. Failure is recorded, never called PASS.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build local React OCR frontend
        working-directory: apps
        run: |
          npm install --no-audit --no-fund
          npm run build --workspace portal
      - name: Install real Chromium and image fixture generator
        run: |
          python -m pip install 'playwright==1.55.0' 'Pillow>=11,<13'
          python -m playwright install --with-deps chromium
      - name: Recognize synthetic real PNG using Tesseract WASM in browser
        run: python tests/portal_real_image_ocr_e2e.py
      - name: Archive OCR quality and model loading evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-real-image-ocr
          path: portal-ocr-browser-result.json
          if-no-files-found: ignore
          retention-days: 7

  multilingual-ocr:
    # Model language packs arrive over public network; this is a separate
    # observed quality gate, not disguised as production language support.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build real WXT extension with local executable OCR worker
        working-directory: apps
        run: |
          npm install --no-audit --no-fund
          npm run build --workspace wxt-ui
          node wxt-ui/scripts/check-native-bundle.mjs
      - name: Install French/Chinese font fixture and Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install 'playwright==1.55.0' 'Pillow>=11,<13'
          python -m playwright install --with-deps chromium
      - name: Execute French and Simplified Chinese image recognition
        run: python tests/wxt_multilingual_ocr_e2e.py
      - name: Archive language recognition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-ocr-evidence
          path: wxt-multilingual-ocr-report.json
          if-no-files-found: ignore
          retention-days: 7
