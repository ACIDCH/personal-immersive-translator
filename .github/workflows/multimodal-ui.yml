name: Multimodal Platform UI & BYOK validation

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'cloudflare/multimodal-api/**'
      - 'src/lib/ai-profiles.js'
      - 'src/lib/providers.js'
      - 'src/lib/settings.js'
      - 'src/options*'
      - 'tests/ai-profiles.test.js'
      - '.github/workflows/multimodal-ui.yml'
      - 'tests/wxt_native_web_e2e.py'
      - 'tests/wxt_web_coverage_matrix_e2e.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custom-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check src/lib/ai-profiles.js
          node --check src/lib/providers.js
          node --check src/options.js
      - name: Universal AI profile and Worker contracts
        run: |
          node --test tests/ai-profiles.test.js
          node --check cloudflare/multimodal-api/src/index.mjs
          node --test cloudflare/multimodal-api/test/*.test.mjs

  ui-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [wxt-ui, portal]
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies (preview only)
        run: npm install --no-audit --no-fund
      - name: Prepare WXT types
        if: matrix.app == 'wxt-ui'
        run: npm exec -w wxt-ui wxt prepare
      - name: TypeScript check
        run: npm run check --workspace ${{ matrix.app }}
      - name: Build UI artifact
        run: npm run build --workspace ${{ matrix.app }}
      - name: Confirm output exists
        run: |
          if [ "${{ matrix.app }}" = "wxt-ui" ]; then
            test -f wxt-ui/.output/chrome-mv3/manifest.json
          else
            test -f portal/dist/index.html
          fi
      - name: Validate native WXT web integration package
        if: matrix.app == 'wxt-ui'
        run: node wxt-ui/scripts/check-native-bundle.mjs
      - name: Upload isolated WXT web-integration package
        if: matrix.app == 'wxt-ui'
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-wxt-web-integration-test
          path: apps/wxt-ui/.output/chrome-mv3
          retention-days: 7

  wxt-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated WXT frontend dependencies
        working-directory: apps
        run: |
          npm install --no-audit --no-fund
          npm run build --workspace wxt-ui
          node wxt-ui/scripts/check-native-bundle.mjs
      - name: Install Chromium testing environment
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Test real React + PIT web translation in installed MV3
        run: python tests/wxt_native_web_e2e.py
      - name: Test editorial coverage, dynamic DOM, HTTP 429 and manual recovery
        run: python tests/wxt_web_coverage_matrix_e2e.py
      - name: Archive machine-readable browser coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-web-coverage-matrix
          path: wxt-web-coverage-report.json
          if-no-files-found: ignore
          retention-days: 7
