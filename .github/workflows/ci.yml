name: Validate and package extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned open-source PDF.js
        run: npm install --no-audit --no-fund --ignore-scripts --omit=optional
      - name: Static checks and unit tests
        run: npm run verify
      - name: Export reproducible dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile
          path: package-lock.json
          retention-days: 7
      - name: Validate Python PDF/OCR bridge syntax
        run: python -m compileall -q services benchmarks
      - name: Generate and inspect hash/source manifest
        run: node scripts/build-manifest.mjs
      - name: Package installable extension
        run: |
          zip -q -r personal-immersive-translator-alpha.zip manifest.json BUILD_MANIFEST.json src assets README.md LICENSE docs services
          unzip -l personal-immersive-translator-alpha.zip
      - name: Create full-source snapshot (including tests and pinned dependency lock)
        run: |
          zip -q -r personal-immersive-translator-full-source.zip manifest.json BUILD_MANIFEST.json src assets README.md LICENSE docs services tests scripts benchmarks .github .gitignore package.json package-lock.json
      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: personal-immersive-translator-alpha
          path: personal-immersive-translator-alpha.zip
          retention-days: 14
      - name: Upload complete source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: personal-immersive-translator-source
          path: personal-immersive-translator-full-source.zip
          retention-days: 14
  browser-dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Python client
        run: python -m pip install 'playwright==1.55.0'
      - name: Check preinstalled Google Chrome
        run: google-chrome --version
      - name: Run real Chrome DOM regression fixtures
        run: python tests/browser_e2e.py
      - name: Check long-page and SPA bilingual stability
        run: python tests/web_stability_e2e.py
      - name: Check automatic provider-call budget and manual continuation
        run: python tests/web_request_budget_e2e.py
      - name: Run YouTube Netflix Panopto simulated player compatibility
        run: python tests/player_compat_e2e.py
      - name: Run real Chrome ASR subtitle backpressure and latency UI test
        run: python tests/live_caption_e2e.py
  pdf-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local Tesseract and test fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-chi-sim tesseract-ocr-jpn tesseract-ocr-kor ocrmypdf ghostscript fonts-dejavu-core fonts-noto-cjk
      - name: Install local bridge test dependencies
        run: |
          python -m pip install -r services/requirements.txt httpx Pillow
      - name: Check PDF/OCR local bridge integration, including real CJK OCR
        env:
          PIT_REQUIRE_CJK_OCR: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  extension-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium with MV3 extension support
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          python -m pip install PyMuPDF
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and vendor pinned PDF.js before loading extension
        run: |
          npm install --no-audit --no-fund --ignore-scripts --omit=optional
          npm run vendor:pdf
      - name: Test real unpacked extension UI
        run: python tests/extension_smoke.py
