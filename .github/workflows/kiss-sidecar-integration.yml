name: POC - KISS Whisper subtitles and PDF sidecar
on:
  push:
    branches:
      - feat/kiss-github-oneclick-diagnostics-v049
  pull_request:
    paths:
      - 'scripts/assemble-kiss-sidecar.mjs'
      - 'tests/kiss-sidecar.test.js'
      - 'tests/kiss_sidecar_mv3_e2e.py'
      - 'src/kiss/**'
      - 'tests/kiss-whisper-readiness.test.js'
      - 'tests/kiss-site-diagnostics.test.js'
      - 'tests/kiss-github-diagnostics.test.js'
      - '.github/workflows/kiss-sidecar-integration.yml'
permissions:
  contents: read
jobs:
  kiss-mv3-sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PIT integration assembly and local Whisper readiness
        run: node --test tests/kiss-sidecar.test.js tests/kiss-whisper-readiness.test.js tests/kiss-site-diagnostics.test.js tests/kiss-github-diagnostics.test.js
      - name: Check personal Windows PowerShell build script syntax without running it
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/build-kiss-personal-poc.ps1',[ref]$tokens,[ref]$errors
          ) | Out-Null
          if($errors.Count -gt 0){ $errors | Out-String | Write-Host; exit 1 }
      - name: Checkout fixed GPL KISS source outside our project
        run: |
          git clone --no-checkout --filter=blob:none https://github.com/fishjar/kiss-translator.git /tmp/pit-kiss-upstream
          git -C /tmp/pit-kiss-upstream checkout --detach a1279f2517bd478ef1dd93b941f9177094486cd4
          test "$(git -C /tmp/pit-kiss-upstream rev-parse HEAD)" = "a1279f2517bd478ef1dd93b941f9177094486cd4"
          node scripts/upstream-kiss-audit.mjs /tmp/pit-kiss-upstream
      - name: Build actual original KISS Chrome extension
        working-directory: /tmp/pit-kiss-upstream
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'
          GENERATE_SOURCEMAP: 'false'
        run: |
          npm install --global --no-audit --no-fund pnpm@9.15.9
          pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
          pnpm build:chrome
      - name: Copy official pinned PDF.js vendor assets
        run: |
          npm install --no-audit --no-fund --ignore-scripts --omit=optional
          npm run vendor:pdf
      - name: Assemble PIT sidecar into disposable KISS Chrome build
        run: |
          node scripts/assemble-kiss-sidecar.mjs /tmp/pit-kiss-upstream/build/chrome
          node --check /tmp/pit-kiss-upstream/build/chrome/pit/options.js
          node --check /tmp/pit-kiss-upstream/build/chrome/pit/asr-controller.js
          node --check /tmp/pit-kiss-upstream/build/chrome/pit/whisper-readiness.js
          node --check /tmp/pit-kiss-upstream/build/chrome/pit/site-diagnostics.js
          node --check /tmp/pit-kiss-upstream/build/chrome/pit/site-diagnostics-ui.js
          node --check /tmp/pit-kiss-upstream/build/chrome/pit/github-diagnostics.js
          node --check /tmp/pit-kiss-upstream/build/chrome/pit/bridge-client.js
          node --check /tmp/pit-kiss-upstream/build/chrome/pit/view-client.js
          node --check /tmp/pit-kiss-upstream/build/chrome/pit/control.js
          node --check /tmp/pit-kiss-upstream/build/chrome/pit/offscreen.js
          node scripts/upstream-kiss-audit.mjs /tmp/pit-kiss-upstream
      - name: Install Playwright Chromium (unbranded, MV3 test capable)
        run: |
          python -m pip install 'playwright==1.55.0' 'PyMuPDF>=1.24,<2'
          python -m playwright install --with-deps chromium
      - name: Verify live Chromium MV3 KISS popup, file tools and PDF.js
        run: python tests/kiss_sidecar_mv3_e2e.py
      # Owner specifically requested a ready-to-install, unpacked extension ZIP.
      # Provide the GPL-3.0 corresponding source as a separate artifact from
      # the same verified commit/run, without publishing a GitHub Release.
      - name: Package tested Chrome extension and corresponding GPL source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/combo-src/kiss-translator-v2.1.1 dist/combo-src/pit-adaptation-v0.4.9
          cat > /tmp/pit-kiss-upstream/build/chrome/README-PIT-TEST-PACKAGE.txt <<'EOF'
          Personal Immersive Translator + KISS v2.1.1 (TEST BUILD ONLY)
          Verified integration branch: feat/kiss-github-oneclick-diagnostics-v049
          This combines MIT PIT original code with GPL-3.0 KISS Translator.
          The COMBINED PACKAGE is GPL-3.0, NOT licensed as entirely MIT.
          Includes a separate corresponding-source ZIP from the same CI run.
          Installation: unzip; load the directory containing manifest.json in
          chrome://extensions (Developer mode > Load unpacked).
          Locally activated translation/diagnostics; no tokens bundled.
          This is a development build, not validated for production accounts.
          EOF
          (cd /tmp/pit-kiss-upstream/build/chrome && zip -q -r "$GITHUB_WORKSPACE/dist/PIT-KISS-v049-CHROME-TEST.zip" .)
          git -C /tmp/pit-kiss-upstream archive HEAD | tar -x -C dist/combo-src/kiss-translator-v2.1.1
          git archive HEAD | tar -x -C dist/combo-src/pit-adaptation-v0.4.9
          cat > dist/combo-src/README-SOURCE.txt <<'EOF'
          Corresponding source for PIT-KISS-v049-CHROME-TEST.zip
          KISS original source: fishjar/kiss-translator at SHA a1279f2517bd478ef1dd93b941f9177094486cd4
          PIT adaptation source: ACIDCH/personal-immersive-translator at this CI checkout SHA
          Build entry: pit-adaptation-v0.4.9/scripts/assemble-kiss-sidecar.mjs
          MIT applies to original PIT files; GPL-3.0 applies to the combined
          derivative work, with original licenses included in source folders.
          Build procedure: docs/KISS_REAL_PLATFORM_ACCEPTANCE_zh-CN.md
          EOF
          (cd dist && zip -q -r PIT-KISS-v049-CORRESPONDING-SOURCE.zip combo-src)
          unzip -p dist/PIT-KISS-v049-CHROME-TEST.zip manifest.json | grep -q '"manifest_version": 3'
          unzip -l dist/PIT-KISS-v049-CORRESPONDING-SOURCE.zip | grep -q 'combo-src/kiss-translator-v2.1.1/LICENSE'
          unzip -l dist/PIT-KISS-v049-CORRESPONDING-SOURCE.zip | grep -q 'combo-src/pit-adaptation-v0.4.9/scripts/assemble-kiss-sidecar.mjs'
          ls -lh dist/PIT-KISS-v049-*.zip
      - name: Upload ready-to-install Chrome test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PIT-KISS-v049-CHROME-TEST
          path: dist/PIT-KISS-v049-CHROME-TEST.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload matching combined corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: PIT-KISS-v049-CORRESPONDING-SOURCE
          path: dist/PIT-KISS-v049-CORRESPONDING-SOURCE.zip
          if-no-files-found: error
          retention-days: 14
