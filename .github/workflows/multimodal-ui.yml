name: Multimodal Platform UI & BYOK validation

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'cloudflare/multimodal-api/**'
      - 'src/lib/ai-profiles.js'
      - 'src/lib/providers.js'
      - 'src/lib/settings.js'
      - 'src/options*'
      - 'tests/ai-profiles.test.js'
      - '.github/workflows/multimodal-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custom-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check src/lib/ai-profiles.js
          node --check src/lib/providers.js
          node --check src/options.js
      - name: Universal AI profile and Worker contracts
        run: |
          node --test tests/ai-profiles.test.js
          node --check cloudflare/multimodal-api/src/index.mjs
          node --test cloudflare/multimodal-api/test/*.test.mjs

  ui-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [wxt-ui, portal]
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies (preview only)
        run: npm install --no-audit --no-fund
      - name: Prepare WXT types
        if: matrix.app == 'wxt-ui'
        run: npm exec -w wxt-ui wxt prepare
      - name: TypeScript check
        run: npm run check --workspace ${{ matrix.app }}
      - name: Build UI artifact
        run: npm run build --workspace ${{ matrix.app }}
      - name: Confirm output exists
        run: |
          if [ "${{ matrix.app }}" = "wxt-ui" ]; then
            test -f wxt-ui/.output/chrome-mv3/manifest.json
          else
            test -f portal/dist/index.html
          fi
      - name: Validate native WXT web integration package
        if: matrix.app == 'wxt-ui'
        run: node wxt-ui/scripts/check-native-bundle.mjs
